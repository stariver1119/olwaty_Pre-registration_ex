<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>올와치 (olwaty) - 내가 고른 크리에이터를 가장 편하게</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', sans-serif;
            background-color: #0d0c12;
            margin: 0;
            overflow-x: hidden;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .animate-pulse-glow {
            animation: pulse-glow 4s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 6s infinite ease-in-out;
        }

        @keyframes scroll-x {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-scroll-x {
            display: flex;
            width: max-content;
            animation: scroll-x 20s linear infinite;
        }

        @keyframes progress-sweep {
            0% {
                filter: brightness(0.95);
            }

            50% {
                filter: brightness(1.15);
            }

            100% {
                filter: brightness(0.95);
            }
        }

        .animate-progress-sweep {
            animation: progress-sweep 2.4s ease-in-out infinite;
        }

        @keyframes gradient-heading {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 100% 50%;
            }
        }

        .animate-gradient-heading {
            background-size: 160% 160%;
            animation: gradient-heading 5.5s ease-in-out infinite alternate;
        }

        @keyframes heading-unify {
            0% {
                opacity: 0.82;
                filter: blur(1.2px);
            }

            100% {
                opacity: 1;
                filter: blur(0);
            }
        }

        .animate-heading-unify {
            animation: heading-unify 900ms ease forwards;
        }

        @keyframes input-sweep {
            0% {
                transform: translateX(-130%);
                opacity: 0;
            }

            20% {
                opacity: 0.35;
            }

            80% {
                opacity: 0.22;
            }

            100% {
                transform: translateX(130%);
                opacity: 0;
            }
        }

        .animate-input-sweep::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(160, 212, 240, 0.28), transparent);
            animation: input-sweep 2.9s ease-in-out infinite;
        }

        @keyframes input-glow {
            0% {
                opacity: 0.18;
            }

            50% {
                opacity: 0.34;
            }

            100% {
                opacity: 0.18;
            }
        }

        .animate-input-glow {
            animation: input-glow 2.6s ease-in-out infinite;
        }

        @keyframes button-breathe {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.015);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-button-breathe {
            animation: button-breathe 2.2s ease-in-out infinite;
        }

        @keyframes success-ripple {
            0% {
                box-shadow: inset 0 0 0 0 rgba(92, 166, 206, 0.22);
            }

            100% {
                box-shadow: inset 0 0 0 56px rgba(92, 166, 206, 0);
            }
        }

        .animate-success-ripple {
            animation: success-ripple 680ms ease-out;
        }

        @keyframes glow-soft {
            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 0.34;
            }

            100% {
                opacity: 0.2;
            }
        }

        .animate-glow-soft {
            animation: glow-soft 3s ease-in-out infinite;
        }

        .text-glow {
            text-shadow: 0 0 15px rgba(92, 166, 206, 0.4);
        }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
